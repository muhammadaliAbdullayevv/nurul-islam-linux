<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nurul Islam: Namoz va Zikrlar</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(155deg, #0c5007 0%, #0b3b1f 50%, #061813 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(208, 243, 159, 0.25);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(208, 243, 159, 0.16);
      color: #d0f39f;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #cbd5e1; font-size: 14px; line-height: 1.55; margin: 0 0 20px; }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px 18px;
      border-radius: 16px;
      background: #d0f39f;
      color: #0c4703;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      transition: transform 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .meta { margin-top: 14px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge" id="ver-badge">v1.1.0 (Build 2)</span>
    <h1>Nurul Islam: Namoz va Zikrlar</h1>
    <p>Aniq namoz vaqtlari, Qibla kompasi, Qur'oni Karim tarjima va qiroati, Tahorat va namoz darslari, Tasbeh, Zikrlar, Qazo va Masjidlar.</p>
    <a class="btn" id="dl-btn" href="/downloads/nurul-quran-latest.apk" download>Android APK yuklab olish</a>
    <div class="meta" id="notes-box"></div>
  </div>
  <script>
    fetch('/version.json?t=' + Date.now())
      .then(r => r.json())
      .then(d => {
        document.getElementById('ver-badge').textContent = 'v' + d.versionName + ' (Build ' + d.versionCode + ')';
        if (d.apkUrl) document.getElementById('dl-btn').href = d.apkUrl;
        if (d.notes && (d.notes.uz_lat || d.notes.en)) {
          document.getElementById('notes-box').textContent = d.notes.uz_lat || d.notes.en;
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
